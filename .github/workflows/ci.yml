name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# React Doctor quality gates — 9 parallel jobs
# Supabase env placeholders so Next.js build/typecheck don't require real project

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_DEPLOYMENT_MODE: selfhosted
  CRON_SECRET: ci-secret

jobs:
  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Super strict (2026-08-31): unsafe-* + no-img-element now errors (0 unsafe, 0 img).
      # Remaining: 38 cognitive-complexity warns (proxy.ts 120 fixed). Budget 38 ratchets to 0.
      # Next: app/api/book:111 (176), cron/notify:200 (162), booking-form:240 (138) etc.
      - name: ESLint (super strict — unsafe/img errors block, cognitive ratchet)
        run: npx eslint . --max-warnings 38
      - name: Biome format check
        run: npm run format:check || echo "Biome format check has diffs — run 'npm run format' locally (non-blocking for minimal gate)"

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Super strict: typecheck is now blocking (tsc --noEmit 0, ignoreBuildErrors removed).
      - run: npm run typecheck

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  knip:
    name: Knip (unused deps/files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run knip

  depcruise:
    name: Depcruise (architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate dependency rules
        run: npm run depcruise
      - name: Generate dot graph artifact
        run: npm run depcruise:graph || echo "graph step needs dot installed — dot output still in dependency-graph.dot"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-graph-dot
          path: dependency-graph.dot
          if-no-files-found: warn

  bundle-analyzer:
    name: Bundle analyzer (ANALYZE=true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build with ANALYZE=true (verifies @next/bundle-analyzer wiring)
        run: npm run analyze
        env:
          ANALYZE: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analyzer-report
          path: .next/analyze
          if-no-files-found: warn

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    # Non-blocking: performance budgets are advisory until budgets are tuned on real data.
    # Change `continue-on-error: false` once budgets stabilize.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: LHCI autorun (needs build + start; uses lighthouserc.json)
        run: npm run lighthouse

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    name: Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (high)
        run: npm audit --audit-level=high || true
      - name: npm audit (full report)
        run: npm audit || true
